[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fm-dlp-core"
version = "0.1.7"
description = "Core package for YouTube audio/video downloading and searching."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [
    {name = "Fkernel653"}
]
keywords = [
    "framework",
    "library",
    "libraries",
    "lib",
    "youtube",
    "ytmusicapi",
    "youtube-music",
    "yt-dlp",
    "yt-dlp-wrapper",
    "ffmpeg",
    "agplv3",
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]

dependencies = [
    "yt-dlp",
    "ytmusicapi",
    "mutagen",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.urls]
Homepage = "https://github.com/Fkernel653/fm-dlp"
Repository = "https://github.com/Fkernel653/fm-dlp.git"
Documentation = "https://github.com/Fkernel653/fm-dlp#readme"

[tool.hatch.build.targets.wheel]
packages = ["fm_dlp_core"]
